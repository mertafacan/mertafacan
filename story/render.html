<script type="module">

const LAYOUT = await (await fetch('/layout.json')).json();
const params = new URLSearchParams(location.search);

  }

const texLoader = new THREE.TextureLoader(); const cardTex = new Map();

const blobTex = await texLoader.loadAsync('/data/textures/blob.png'); blobTex.colorSpace = THREE.SRGBColorSpace;

    const m = new THREE.MeshBasicMaterial({ transparent: true, alphaTest: 0.35, depthWrite: true, fog: false });

// ------------------------------------------------------------ prop animation + particles
const home = {}; for (const k in nodes) home[k] = { p: nodes[k].position.clone(), q: nodes[k].quaternion.clone(), s: nodes[k].scale.clone(), v: nodes[k].visible };

  }

  if (fx.bubbles) { const b = fx.bubbles; for (let i = 0; i < (b.n || 26); i++) { const m = fxMesh(idx++); m.material = bubbleMat; const ph = hash(i), life = ((b.t * (0.7 + hash(i + 9) * 0.8) + ph * 3) % 1.4) / 1.4;
      m.position.set(b.o[0] + (hash(i + 2) - 0.5) * b.w, b.o[1] + life * b.h, b.o[2] + (hash(i + 5) - 0.5) * b.w * 0.6); m.scale.setScalar((0.6 + hash(i + 4)) * (1 - life * 0.4) * (b.size || 1)); m.visible = true; } }
  if (fx.sparks) { const b = fx.sparks; for (let i = 0; i < (b.n || 30); i++) { const m = fxMesh(idx++); m.material = sparkMat; const t = (b.t * (0.5 + hash(i) * 0.6) + hash(i + 1)) % 1;
      const ang = hash(i + 3) * 6.28, rad = (0.1 + hash(i + 7) * 0.5) * b.r * (0.3 + t);
      m.position.set(b.o[0] + Math.cos(ang) * rad, b.o[1] + Math.sin(ang * 1.7) * rad * 0.8 + (b.rise || 0) * t, b.o[2] + 0.3 + Math.sin(ang) * rad * 0.3); m.scale.setScalar((0.5 + hash(i + 8)) * (1 - t) * (b.size || 1.4)); m.visible = true; } }
  fxGroup.children.forEach(m => { const c = camera.position; });
}

  cards.forEach((c, i) => {
    const g = getCard(i); const { mesh, sh } = g.userData; g.visible = true;
    mesh.material.map = getTex(c.img); mesh.material.needsUpdate = true; const al = c.a ?? 1; mesh.material.opacity = al; g.visible = al > 0.36;
    g.position.set(c.x, c.y || 0, c.z);
    const yaw = Math.atan2(camera.position.x - c.x, camera.position.z - c.z);   // vertical-axis turn only
    g.rotation.set(0, yaw, 0); const s = c.s || 1; g.scale.set(s * (c.flip ? -1 : 1), s * (c.sy || 1), s);
    g.userData.sh.visible = !c.noShadow; sh.scale.set(1, 1, 1); sh.rotation.set(-Math.PI / 2, 0, -yaw * 0 );

window.sheet = async (items, cols = 6, cw = 300) => {

  const c = document.createElement('canvas'); c.width = cols * (cw + pad) + pad; c.height = rows * (ch + lh + pad) + pad; const x = c.getContext('2d');
  x.fillStyle = '#1b1424'; x.fillRect(0, 0, c.width, c.height); x.font = 'bold 15px sans-serif'; x.textBaseline = 'top';
  for (let k = 0; k < items.length; k++) {

</script>
